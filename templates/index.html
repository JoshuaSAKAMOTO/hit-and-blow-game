<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hit & Blow Game</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>Hit & Blow</h1>
    <p style="text-align: center; font-style: italic;">数字を当てる頭脳ゲーム</p>

    <h2>ルール説明</h2>
    <p>コンピュータが選んだ<strong>3桁の重複しない数字</strong>を当ててください。</p>
    <ul>
      <li><strong>Hit</strong>: 数字と桁が合っている</li>
      <li><strong>Blow</strong>: 数字は合っているが桁が違う</li>
    </ul>
    <p>10回以内に正解を目指しましょう！</p>

    {% if current_user.is_authenticated %}
      <a href="{{ url_for('dashboard') }}" class="button">ダッシュボードへ</a>
    {% else %}
      <a href="{{ url_for('login') }}" class="button">ログインして開始</a>
      <div class="auth-link">
        初めての方は<a href="{{ url_for('signup') }}">新規登録</a>
      </div>
    {% endif %}
  </div>
</body>
</html>
