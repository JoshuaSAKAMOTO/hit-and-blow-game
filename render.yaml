services:
  - type: web
    name: hit-and-blow-game
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hit-and-blow-db
          property: connectionString

databases:
  - name: hit-and-blow-db
    databaseName: hitblow
    user: hitblow
